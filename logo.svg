<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Document paper -->
  <g transform="translate(30, 18)">
    <!-- Paper body -->
    <path d="M0,4 C0,1.8 1.8,0 4,0 L38,0 L52,14 L52,72 C52,74.2 50.2,76 48,76 L4,76 C1.8,76 0,74.2 0,72 Z" fill="url(#paper)" filter="url(#shadow)"/>
    <!-- Folded corner -->
    <path d="M38,0 L38,14 L52,14 Z" fill="#cbd5e1" opacity="0.6"/>
    <path d="M38,0 L52,14" stroke="#94a3b8" stroke-width="0.5" fill="none" opacity="0.4"/>
    <!-- Text lines -->
    <rect x="10" y="22" width="32" height="2.5" rx="1.25" fill="#6366f1" opacity="0.4"/>
    <rect x="10" y="28" width="28" height="2.5" rx="1.25" fill="#6366f1" opacity="0.3"/>
    <rect x="10" y="34" width="34" height="2.5" rx="1.25" fill="#6366f1" opacity="0.25"/>
    <rect x="10" y="40" width="20" height="2.5" rx="1.25" fill="#6366f1" opacity="0.2"/>
  </g>

  <!-- Citation quote mark (left) -->
  <g transform="translate(18, 52)" filter="url(#glow)">
    <path d="M0,16 C0,7.2 5.6,1.6 12,0 L13,3 C9,4.5 7,7.5 7,11 L10,11 L10,22 L0,22 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M16,16 C16,7.2 21.6,1.6 28,0 L29,3 C25,4.5 23,7.5 23,11 L26,11 L26,22 L16,22 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Upward arrow (citation growth) -->
  <g transform="translate(68, 68)" filter="url(#glow)">
    <path d="M2,22 L12,8 L22,22" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12,8 L12,30" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Sparkle dots -->
    <circle cx="4" cy="6" r="1.5" fill="#34d399" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="4" r="1" fill="#22d3ee" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Glow ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#bg)" stroke-width="2" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
