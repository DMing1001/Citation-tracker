<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080e1a"/>
      <stop offset="100%" style="stop-color:#0c1425"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#6366f1" stroke-opacity="0.04" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="300" cy="200" r="200" fill="#6366f1" opacity="0.06"/>
  <circle cx="900" cy="400" r="250" fill="#22d3ee" opacity="0.04"/>

  <!-- Logo icon (centered left) -->
  <g transform="translate(140, 175)">
    <!-- Background circle -->
    <circle cx="60" cy="60" r="56" fill="url(#accent)"/>
    <!-- Document paper -->
    <g transform="translate(30, 18)">
      <path d="M0,4 C0,1.8 1.8,0 4,0 L38,0 L52,14 L52,72 C52,74.2 50.2,76 48,76 L4,76 C1.8,76 0,74.2 0,72 Z" fill="#fff" fill-opacity="0.92"/>
      <path d="M38,0 L38,14 L52,14 Z" fill="#cbd5e1" opacity="0.5"/>
      <rect x="10" y="22" width="32" height="2.5" rx="1.25" fill="#6366f1" opacity="0.4"/>
      <rect x="10" y="28" width="28" height="2.5" rx="1.25" fill="#6366f1" opacity="0.3"/>
      <rect x="10" y="34" width="34" height="2.5" rx="1.25" fill="#6366f1" opacity="0.25"/>
    </g>
    <!-- Citation quotes -->
    <g transform="translate(18, 52)">
      <path d="M0,16 C0,7.2 5.6,1.6 12,0 L13,3 C9,4.5 7,7.5 7,11 L10,11 L10,22 L0,22 Z" fill="#fbbf24" opacity="0.9"/>
      <path d="M16,16 C16,7.2 21.6,1.6 28,0 L29,3 C25,4.5 23,7.5 23,11 L26,11 L26,22 L16,22 Z" fill="#fbbf24" opacity="0.9"/>
    </g>
    <!-- Upward arrow -->
    <g transform="translate(68, 68)">
      <path d="M2,22 L12,8 L22,22" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12,8 L12,30" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="320" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="72" font-weight="800" fill="#f8fafc">
    <tspan fill="url(#accent)">Cite</tspan><tspan fill="#22d3ee">Glow</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="320" y="290" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="28" fill="#64748b" font-weight="400">
    论文引用追踪器
  </text>

  <!-- Description -->
  <text x="320" y="350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="20" fill="#475569">
    输入 DOI · 三源并查 · 一键追踪引用
  </text>

  <!-- Data source badges -->
  <g transform="translate(320, 380)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
    <text x="40" y="20" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">OpenAlex</text>
    
    <rect x="90" y="0" width="110" height="30" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1"/>
    <text x="145" y="20" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">Semantic Scholar</text>
    
    <rect x="210" y="0" width="80" height="30" rx="6" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
    <text x="250" y="20" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">CrossRef</text>
  </g>

  <!-- URL -->
  <text x="320" y="460" font-family="-apple-system,sans-serif" font-size="18" fill="#6366f1" font-weight="600">citeglow.com</text>

  <!-- Decorative citation numbers on right side -->
  <g transform="translate(850, 120)" opacity="0.12">
    <text x="0" y="0" font-family="-apple-system,sans-serif" font-size="120" font-weight="900" fill="#6366f1">42</text>
    <text x="180" y="80" font-family="-apple-system,sans-serif" font-size="80" font-weight="900" fill="#22d3ee">17</text>
    <text x="60" y="200" font-family="-apple-system,sans-serif" font-size="100" font-weight="900" fill="#fbbf24">89</text>
    <text x="220" y="280" font-family="-apple-system,sans-serif" font-size="60" font-weight="900" fill="#34d399">156</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#6366f1" fill-opacity="0.08"/>
  <text x="600" y="620" font-family="-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">免费 · 无需注册 · 三源数据互补</text>
</svg>
